name: Temporary LifeSpace 0.22 adapter patch

on:
  push:
    branches:
      - fix/lifespace-0.21-ux-convergence

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[skip-lifespace-022-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/lifespace-0.21-ux-convergence
      - name: Patch adapter and tests
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text().replace('\r\n', '\n')

          def write(path, text):
              Path(path).write_text(text)

          def replace_once(text, old, new, label):
              if old not in text:
                  raise RuntimeError(f'{label}: anchor not found')
              return text.replace(old, new, 1)

          def replace_all(text, old, new, label):
              if old not in text:
                  raise RuntimeError(f'{label}: anchor not found')
              return text.replace(old, new)

          # LifeSpace node
          path = 'nodes/LifeSpace/LifeSpace.node.ts'
          text = read(path)
          text = replace_once(text,
          """type QueryFilter = {
            field?: string;
            operator?: 'exact' | 'from' | 'to';
            value?: string;
          };

          type QueryPage = {""",
          """type QueryFilter = {
            field?: string;
            operator?: 'exact' | 'from' | 'to';
            value?: string;
          };

          type QuerySort = {
            field?: string;
            direction?: 'asc' | 'desc';
          };

          type QueryPage = {""", 'node QuerySort')

          text = replace_once(text,
          """  const options = context.getNodeParameter('options', itemIndex, {}) as IDataObject;
            const sortField = String(options.sortField ?? '').trim();
            const sortDirection = String(options.sortDirection ?? 'desc').trim();
            const configuredCursor = String(options.cursor ?? '').trim();
            const cursor = cursorOverride ?? configuredCursor;
            const filters = context.getNodeParameter('filters.filter', itemIndex, []) as QueryFilter[];

            if (search) qs.q = search;
            if (sortField) qs.sort = `${sortField}:${sortDirection}`;
            qs.limit = limit;""",
          """  const options = context.getNodeParameter('options', itemIndex, {}) as IDataObject;
            const configuredSorts = context.getNodeParameter('sorts.sort', itemIndex, []) as QuerySort[];
            const legacySortField = String(options.sortField ?? '').trim();
            const legacySortDirection = String(options.sortDirection ?? 'desc').trim();
            const configuredCursor = String(options.cursor ?? '').trim();
            const cursor = cursorOverride ?? configuredCursor;
            const filters = context.getNodeParameter('filters.filter', itemIndex, []) as QueryFilter[];

            if (search) qs.q = search;

            const orderedSorts: string[] = [];
            const usedSortFields = new Set<string>();
            for (const sort of configuredSorts) {
              const field = String(sort.field ?? '').trim();
              if (!field) continue;
              const direction = String(sort.direction ?? 'asc').trim();
              if (direction !== 'asc' && direction !== 'desc') {
                throw new NodeOperationError(context.getNode(), `Sort direction for ${field} must be asc or desc`, { itemIndex });
              }
              if (usedSortFields.has(field)) {
                throw new NodeOperationError(context.getNode(), `Sort field ${field} may be supplied only once`, { itemIndex });
              }
              usedSortFields.add(field);
              orderedSorts.push(`${field}:${direction}`);
            }

            if (orderedSorts.length === 1) qs.sort = orderedSorts[0];
            if (orderedSorts.length > 1) qs.sort = orderedSorts;
            if (orderedSorts.length === 0 && legacySortField) qs.sort = `${legacySortField}:${legacySortDirection}`;
            qs.limit = limit;""", 'node queryParameters')

          text = replace_once(text,
          """    displayName: humanizeKey(field.key),""",
          """    displayName: field.title?.trim() || humanizeKey(field.key),""", 'node mapper title')

          old_options = """      {
                displayName: 'Options',
                name: 'options',
                type: 'collection',
                placeholder: 'Add Option',
                default: {},
                displayOptions: { show: { resource: ['modelRecord'], operation: ['list'] } },
                options: [
                  {
                    displayName: 'Sort Field Name or ID',
                    name: 'sortField',
                    type: 'options',
                    typeOptions: { loadOptionsMethod: 'getSortableFields' },
                    options: [],
                    default: '',
                    description: 'Choose from the list, or specify an ID using an <a href=\"https://docs.n8n.io/code/expressions/\">expression</a>',
                  },
                  {
                    displayName: 'Sort Direction',
                    name: 'sortDirection',
                    type: 'options',
                    options: [
                      { name: 'Ascending', value: 'asc' },
                      { name: 'Descending', value: 'desc' },
                    ],
                    default: 'desc',
                  },
                  {
                    displayName: 'Cursor',
                    name: 'cursor',
                    type: 'string',
                    default: '',
                    description: 'Advanced manual pagination. Normally leave empty and use Return All or Limit.',
                  },
                ],
              },"""
          new_options = """      {
                displayName: 'Sorts',
                name: 'sorts',
                type: 'fixedCollection',
                default: {},
                placeholder: 'Add Sort',
                typeOptions: { multipleValues: true },
                displayOptions: { show: { resource: ['modelRecord'], operation: ['list'] } },
                options: [
                  {
                    displayName: 'Sort',
                    name: 'sort',
                    values: [
                      {
                        displayName: 'Field Name or ID',
                        name: 'field',
                        type: 'options',
                        typeOptions: { loadOptionsMethod: 'getSortableFields' },
                        options: [],
                        default: '',
                        required: true,
                        description: 'Choose from the sortable fields advertised by LifeSpace Runtime Discovery',
                      },
                      {
                        displayName: 'Direction',
                        name: 'direction',
                        type: 'options',
                        options: [
                          { name: 'Ascending', value: 'asc' },
                          { name: 'Descending', value: 'desc' },
                        ],
                        default: 'asc',
                      },
                    ],
                  },
                ],
                description: 'Add sort criteria in priority order. If omitted, LifeSpace applies the server-declared default order.',
              },
              {
                displayName: 'Options',
                name: 'options',
                type: 'collection',
                placeholder: 'Add Option',
                default: {},
                displayOptions: { show: { resource: ['modelRecord'], operation: ['list'] } },
                options: [
                  {
                    displayName: 'Cursor',
                    name: 'cursor',
                    type: 'string',
                    default: '',
                    description: 'Advanced manual pagination. Normally leave empty and use Return All or Limit.',
                  },
                ],
              },"""
          text = replace_once(text, old_options, new_options, 'node sort UI')

          text = replace_once(text,
          """          return {
                    name: humanizeKey(fieldKey),
                    value: fieldKey,
                    description: rangeSupported ? `${field?.type ?? 'field'} · equality and range filters` : `${field?.type ?? 'field'} · equality filter`,
                  };""",
          """          return {
                    name: field?.title?.trim() || humanizeKey(fieldKey),
                    value: fieldKey,
                    description: rangeSupported ? `${field?.type ?? 'field'} · equality and range filters` : `${field?.type ?? 'field'} · equality filter`,
                  };""", 'node filter title')

          text = replace_once(text,
          """        return [
                  { name: 'Created At', value: 'createdAt' },
                  { name: 'Updated At', value: 'updatedAt' },
                  ...model.query.sortable.map((fieldKey) => ({ name: humanizeKey(fieldKey), value: fieldKey })),
                ];""",
          """        return [
                  ...model.query.sort.envelopeFields.map((fieldKey) => ({
                    name: humanizeKey(fieldKey),
                    value: fieldKey,
                  })),
                  ...model.query.sortable.map((fieldKey) => {
                    const field = model.fields.find((entry) => entry.key === fieldKey);
                    return { name: field?.title?.trim() || humanizeKey(fieldKey), value: fieldKey };
                  }),
                ];""", 'node sortable options')

          text = replace_once(text,
          """                  qs: queryParameters(this, itemIndex, limit),
                          json: true,""",
          """                  qs: queryParameters(this, itemIndex, limit),
                          arrayFormat: 'repeat',
                          json: true,""", 'node list array format')
          text = replace_once(text,
          """                    qs: queryParameters(this, itemIndex, 200, cursor),
                                json: true,""",
          """                    qs: queryParameters(this, itemIndex, 200, cursor),
                                arrayFormat: 'repeat',
                                json: true,""", 'node returnAll array format')
          write(path, text)

          # Adapter contract tests
          path = 'test/contract.test.mjs'
          text = read(path)
          text = replace_once(text, "              version: 4,", "              version: 6,", 'test task version')
          text = replace_once(text,
          """                { key: 'name', type: 'string', required: true },
                              { key: 'priority', type: 'enum', required: true, values: ['normal', 'high'] },
                              { key: 'status', type: 'enum', required: true, readOnly: true, values: ['pending', 'completed'] },
                              { key: 'dueDate', type: 'date', nullable: true },""",
          """                { key: 'name', type: 'string', title: 'Task Name', required: true },
                              { key: 'priority', type: 'enum', title: 'Priority', required: true, values: ['normal', 'high'] },
                              { key: 'status', type: 'enum', title: 'Status', required: true, readOnly: true, values: ['pending', 'completed'] },
                              { key: 'dueDate', type: 'date', title: 'Due Date', nullable: true },""", 'test field titles')
          text = replace_once(text,
          """              query: {
                            searchable: ['name'],
                            filterable: ['status', 'dueDate'],
                            sortable: ['dueDate'],
                          },""",
          """              query: {
                            searchable: ['name'],
                            filterable: ['status', 'dueDate'],
                            sortable: ['dueDate', 'name'],
                            sort: {
                              parameter: 'sort',
                              syntax: 'field:direction',
                              repeatable: true,
                              ordered: true,
                              maxCriteria: 8,
                              default: ['createdAt:desc'],
                              envelopeFields: ['createdAt', 'updatedAt'],
                            },
                          },""", 'test task sort metadata')
          text = replace_all(text,
          """              fields: [{ key: 'text', type: 'text', required: true }],
                          defaults: {},
                          query: { searchable: ['text'], filterable: [], sortable: [] },""",
          """              fields: [{ key: 'text', type: 'text', title: 'Text', required: true }],
                          defaults: {},
                          query: {
                            searchable: ['text'],
                            filterable: [],
                            sortable: [],
                            sort: {
                              parameter: 'sort',
                              syntax: 'field:direction',
                              repeatable: true,
                              ordered: true,
                              maxCriteria: 8,
                              default: ['createdAt:desc'],
                              envelopeFields: ['createdAt', 'updatedAt'],
                            },
                          },""", 'test note discovery')
          text = replace_once(text,
          """  assert.deepEqual(fields.fields.map((field) => [field.id, field.required]), [
                ['name', true],
                ['priority', false],
                ['dueDate', false],
              ]);
            });""",
          """  assert.deepEqual(fields.fields.map((field) => [field.id, field.displayName, field.required]), [
                ['name', 'Task Name', true],
                ['priority', 'Priority', false],
                ['dueDate', 'Due Date', false],
              ]);
            });

            test('Sortable field options come from LifeSpace 0.22 Discovery metadata', async () => {
              const node = new LifeSpace();
              const options = await node.methods.loadOptions.getSortableFields.call(
                loadOptionsContext(discoveryFixture(), { spaceId: 'spc_test', modelRoute: 'tasks' }),
              );

              assert.deepEqual(options.map((item) => [item.name, item.value]), [
                ['Created At', 'createdAt'],
                ['Updated At', 'updatedAt'],
                ['Due Date', 'dueDate'],
                ['Task Name', 'name'],
              ]);
            });""", 'test mapper titles')
          text = replace_once(text,
          """    qs: {
                  q: 'milk',
                  limit: 25,
                  status: 'pending',
                  dueDateFrom: '2026-09-01',
                },
                json: true,""",
          """    qs: {
                  q: 'milk',
                  limit: 25,
                  status: 'pending',
                  dueDateFrom: '2026-09-01',
                },
                arrayFormat: 'repeat',
                json: true,""", 'test list array format')
          text = replace_once(text,
          """      options: { sortField: 'dueDate', sortDirection: 'asc' },
                  'filters.filter': [],""",
          """      sorts: {
                    sort: [
                      { field: 'dueDate', direction: 'asc' },
                      { field: 'name', direction: 'desc' },
                    ],
                  },
                  options: {},
                  'filters.filter': [],""", 'test multi sort input')
          text = replace_all(text,
          """    sort: 'dueDate:asc',
                limit: 200,""",
          """    sort: ['dueDate:asc', 'name:desc'],
                limit: 200,""", 'test multi sort qs')
          text = replace_once(text,
          """  assert.deepEqual(result[0][0].json, {
                data: {
                  items: [{ id: 'tsk_1' }, { id: 'tsk_2' }],
                  nextCursor: null,
                },
              });
            });

            test('Update fetches current version by default and sends it with the mutation', async () => {""",
          """  assert.equal(context.calls[0].options.arrayFormat, 'repeat');
              assert.equal(context.calls[1].options.arrayFormat, 'repeat');
              assert.deepEqual(result[0][0].json, {
                data: {
                  items: [{ id: 'tsk_1' }, { id: 'tsk_2' }],
                  nextCursor: null,
                },
              });
            });

            test('Legacy single-sort workflow parameters remain executable', async () => {
              const node = new LifeSpace();
              const context = executeContext(
                {
                  resource: 'modelRecord',
                  operation: 'list',
                  spaceId: 'spc_test',
                  modelRoute: 'tasks',
                  search: '',
                  returnAll: false,
                  limit: 10,
                  options: { sortField: 'dueDate', sortDirection: 'desc' },
                  'filters.filter': [],
                },
                () => ({ data: { items: [], nextCursor: null } }),
              );

              await node.execute.call(context);
              assert.equal(context.calls[0].options.qs.sort, 'dueDate:desc');
            });

            test('Update fetches current version by default and sends it with the mutation', async () => {""", 'test legacy sort compatibility')
          write(path, text)

          # Source-level contract test
          path = 'test/source-contract.test.mjs'
          text = read(path)
          text = replace_once(text,
          """  assert.match(discovery, /defaults: Record<string, unknown>/u);
            assert.match(node, /name: 'Record'/u);""",
          """  assert.match(discovery, /defaults: Record<string, unknown>/u);
            assert.match(discovery, /title\\?: string/u);
            assert.match(discovery, /repeatable: true/u);
            assert.match(discovery, /envelopeFields: string\\[\\]/u);
            assert.match(node, /name: 'Record'/u);
            assert.match(node, /name: 'sorts'/u);
            assert.match(node, /field\\.title\\?\\.trim\\(\\) \\|\\| humanizeKey/u);""", 'source contract 0.22')
          write(path, text)

          # README
          path = 'README.md'
          text = read(path)
          text = replace_once(text,
          "This package follows the current LifeSpace Core Kernel `0.21.0` contract family.",
          "This package follows the current LifeSpace Core Kernel `0.22.0` contract family.", 'README baseline')
          text = replace_once(text,
          "- `0.21.0`: current Kernel baseline consumed during this convergence pass.",
          "- `0.21.0`: invitation-token transport hardening retained by the current baseline;\n- `0.22.0`: authoritative field `title` metadata plus ordered repeatable Generic Query sort metadata.", 'README 0.22 bullet')
          text = replace_once(text,
          """Advanced **Options** contain:

          - optional **Sort Field** and **Sort Direction**;
          - manual **Cursor** as an escape hatch.

          If Sort is omitted, the adapter omits the query parameter and LifeSpace supplies its deterministic default order. Ordered multi-field sort is not emulated in the adapter; it will be exposed only when the LifeSpace Generic Query contract supports it.""",
          """Use **Sorts → Add Sort** to add zero or more sort criteria in priority order. Sortable model fields use authoritative `title` metadata from Runtime Discovery, while envelope fields such as `createdAt` / `updatedAt` are offered only when Discovery advertises them. n8n sends multiple criteria as ordered repeated `sort=field:direction` query parameters.

          Advanced **Options** contain manual **Cursor** as an escape hatch.

          If Sorts is omitted, the adapter omits the query parameter and LifeSpace supplies the server-declared deterministic default order. Existing workflow exports that still contain the former single `options.sortField` / `options.sortDirection` parameters remain executable for compatibility.""", 'README list query')
          text = replace_once(text,
          """- ordered multi-field sort after LifeSpace Generic Query supports it;
          - canonical field labels after LifeSpace exposes them in Model semantics / Runtime Discovery;
          - richer relation selectors when LifeSpace exposes an authorized generic lookup surface appropriate for generated clients.""",
          """- richer relation selectors when LifeSpace exposes an authorized generic lookup surface appropriate for generated clients.""", 'README remaining upstream')
          write(path, text)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nodes/LifeSpace/LifeSpace.node.ts test/contract.test.mjs test/source-contract.test.mjs README.md
          git commit -m "feat: consume LifeSpace 0.22 discovery semantics [skip-lifespace-022-patch]"
          git push origin HEAD:fix/lifespace-0.21-ux-convergence
