name: Temporary P0 31 design fix

on:
  push:
    branches:
      - fix/0.1.4-design-time-discovery

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/0.1.4-design-time-discovery
      - name: Apply and verify design-time fix
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          def one(path, label, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              print(f'{label}: {count}')
              if count != 1:
                  raise SystemExit(f'{path} / {label}: expected 1, found {count}')
              p.write_text(text.replace(old, new, 1))

          def all_(path, label, old, new, expected):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              print(f'{label}: {count}')
              if count != expected:
                  raise SystemExit(f'{path} / {label}: expected {expected}, found {count}')
              p.write_text(text.replace(old, new))

          discovery = 'nodes/lifespaceDiscovery.ts'
          one(discovery, 'current parameter resolver', """function loadOptionParameter(context: ILoadOptionsFunctions, name: string): string {
            try {
              return String(context.getNodeParameter(name, '') ?? '').trim();
            } catch {
              return '';
            }
          }""", """export function loadOptionParameter(context: ILoadOptionsFunctions, name: string): string {
            try {
              const current = context.getCurrentNodeParameter(name);
              if (current !== undefined) return String(current ?? '').trim();
            } catch {
              // Fall through for compatible contexts without an editor-current value.
            }
            try {
              return String(context.getNodeParameter(name, '') ?? '').trim();
            } catch {
              return '';
            }
          }""")

          one(discovery, 'legacy modelRoute design fallback', """  const recordType = loadOptionParameter(this, 'recordType');
            const decodedRecordType = recordType ? decodeRecordTypeSelector(recordType) : null;
            if (recordType && !decodedRecordType) {
              throw new NodeOperationError(this.getNode(), 'LifeSpace Record Type selector is invalid. Choose a Record Type from Discovery or pass a Trigger recordType value.');
            }
            const selection = {
              spaceId: loadOptionParameter(this, 'spaceId'),
              modelKey: decodedRecordType?.modelKey ?? '',
            };
            const progressive = await requestProgressiveRuntimeDiscovery(this, baseUrl, selection);
            return progressive ?? requestFullRuntimeDiscovery(this, baseUrl);""", """  const recordType = loadOptionParameter(this, 'recordType');
            const decodedRecordType = recordType ? decodeRecordTypeSelector(recordType) : null;
            if (recordType && !decodedRecordType) {
              throw new NodeOperationError(this.getNode(), 'LifeSpace Record Type selector is invalid. Choose a Record Type from Discovery or pass a Trigger recordType value.');
            }
            const legacyModelRoute = recordType ? '' : loadOptionParameter(this, 'modelRoute');
            if (legacyModelRoute) return requestFullRuntimeDiscovery(this, baseUrl);
            const selection = {
              spaceId: loadOptionParameter(this, 'spaceId'),
              modelKey: decodedRecordType?.modelKey ?? '',
            };
            const progressive = await requestProgressiveRuntimeDiscovery(this, baseUrl, selection);
            return progressive ?? requestFullRuntimeDiscovery(this, baseUrl);""")

          node = 'nodes/LifeSpace/LifeSpace.node.ts'
          one(node, 'import helper', """  loadExecutionRuntimeDiscovery,
            loadRelationTargets,""", """  loadExecutionRuntimeDiscovery,
            loadOptionParameter,
            loadRelationTargets,""")

          one(node, 'option model uses current parameters', """async function optionModel(context: ILoadOptionsFunctions): Promise<{ model: DiscoveryModel; spaceId: string } | null> {
            const spaceId = String(context.getNodeParameter('spaceId', '')).trim();
            const recordTypeValue = String(context.getNodeParameter('recordType', '')).trim();
            if (!spaceId || !recordTypeValue) return null;
            const recordType = decodeRecordTypeSelector(recordTypeValue);
            if (!recordType) {
              throw new NodeOperationError(context.getNode(), 'LifeSpace Record Type selector is invalid. Choose a Record Type from Discovery or pass a Trigger recordType value.');
            }
            const discovery = await loadRuntimeDiscovery.call(context);
            const model = discoveryModel(discovery, spaceId, recordType.modelKey);
            return model ? { model, spaceId } : null;
          }""", """async function optionModel(context: ILoadOptionsFunctions): Promise<{ model: DiscoveryModel; spaceId: string } | null> {
            const spaceId = loadOptionParameter(context, 'spaceId');
            const recordTypeValue = loadOptionParameter(context, 'recordType');
            const legacyModelRoute = recordTypeValue ? '' : loadOptionParameter(context, 'modelRoute');
            if (!spaceId || (!recordTypeValue && !legacyModelRoute)) return null;
            const recordType = recordTypeValue ? decodeRecordTypeSelector(recordTypeValue) : null;
            if (recordTypeValue && !recordType) {
              throw new NodeOperationError(context.getNode(), 'LifeSpace Record Type selector is invalid. Choose a Record Type from Discovery or pass a Trigger recordType value.');
            }
            const discovery = await loadRuntimeDiscovery.call(context);
            const space = discoverySpace(discovery, spaceId);
            const model = recordType
              ? discoveryModel(discovery, spaceId, recordType.modelKey)
              : space?.models.find((entry) => entry.route === legacyModelRoute);
            return model ? { model, spaceId } : null;
          }""")

          one(node, 'relation operation', """  const operation = String(context.getNodeParameter('operation', 'create'));""", """  const operation = loadOptionParameter(context, 'operation') || 'create';""")
          one(node, 'record types current space', """        const spaceId = String(this.getNodeParameter('spaceId', '')).trim();""", """        const spaceId = loadOptionParameter(this, 'spaceId');""")
          one(node, 'record types current operation', """        const operation = String(this.getNodeParameter('operation', 'list'));""", """        const operation = loadOptionParameter(this, 'operation') || 'list';""")
          all_(node, 'mapper current operation', """        const operation = String(this.getNodeParameter('operation', 'create'));""", """        const operation = loadOptionParameter(this, 'operation') || 'create';""", 2)
          one(node, 'action input current key', """        const actionKey = String(this.getNodeParameter('actionKey', '')).trim();""", """        const actionKey = loadOptionParameter(this, 'actionKey');""")

          Path('test/design-time-current-parameters.test.mjs').write_text(r'''import assert from 'node:assert/strict';
          import { createRequire } from 'node:module';
          import { test } from 'node:test';

          const require = createRequire(import.meta.url);
          const { LifeSpace } = require('../dist/nodes/LifeSpace/LifeSpace.node.js');
          const { encodeRecordTypeSelector } = require('../dist/nodes/lifespaceDiscovery.js');
          const BASE_URL = 'https://example.invalid/api/v1';
          const RECORD_TYPE = encodeRecordTypeSelector('task', 'tasks');
          const model = {
            key: 'task', route: 'tasks', version: 1, schemaHash: 'sha256:task', display: { singular: 'Task', plural: 'Tasks' }, description: 'Task', access: ['read', 'write'],
            fields: [{ key: 'name', type: 'string', title: 'Name', required: true }], defaults: {},
            query: { searchable: ['name'], filterable: [], sortable: [], sort: { parameter: 'sort', syntax: 'field:direction', repeatable: true, ordered: true, maxCriteria: 8, default: ['createdAt:desc'], envelopeFields: ['createdAt', 'updatedAt'] } },
            actions: [{ key: 'complete', access: 'write', kind: 'workflow', input: { fields: [] } }], capabilities: [], capabilityBindings: {},
          };
          const inventory = { data: {
            semanticDetailPathTemplate: '/api/v1/spaces/{spaceId}/_discovery/models/{modelKey}',
            models: [{ key: 'task', route: 'tasks', version: 1, schemaHash: 'sha256:task', display: { singular: 'Task', plural: 'Tasks' }, capabilities: [], actions: [{ key: 'complete', access: 'write', kind: 'workflow' }] }],
            spaces: [{ spaceId: 'spc_test', spaceName: 'Test', models: [{ modelKey: 'task', access: ['read', 'write'] }] }],
          } };
          const detail = { data: {
            key: 'task', route: 'tasks', version: 1, schemaHash: 'sha256:task', display: { singular: 'Task', plural: 'Tasks' }, description: 'Task', declaredAccess: ['read', 'write'],
            fields: [{ key: 'name', type: 'string', title: 'Name', required: true }], defaults: {},
            query: { searchable: ['name'], filterable: [], sortable: [], sort: { parameter: 'sort', syntax: 'field:direction', repeatable: true, ordered: true, maxCriteria: 8, genericDefault: ['createdAt:desc'], envelopeFields: ['createdAt', 'updatedAt'] } },
            actions: [{ key: 'complete', access: 'write', kind: 'workflow', input: { fields: [] } }], capabilities: [], capabilityBindings: {},
          } };
          const aggregate = { data: { spaces: [{ spaceId: 'spc_test', spaceName: 'Test', models: [model] }] } };

          function context(current, saved = current) {
            const calls = [];
            return {
              calls,
              getCredentials: async () => ({ baseUrl: `${BASE_URL}/` }),
              getNodeParameter(name, fallback) { return Object.prototype.hasOwnProperty.call(saved, name) ? saved[name] : fallback; },
              getCurrentNodeParameter(name) { return Object.prototype.hasOwnProperty.call(current, name) ? current[name] : undefined; },
              getCurrentNodeParameters() { return current; },
              getNode: () => ({ name: 'LifeSpace' }),
              helpers: { async httpRequestWithAuthentication(_credential, options) {
                calls.push(options);
                if (options.url === `${BASE_URL}/me/_discovery/inventory`) return inventory;
                if (options.url === `${BASE_URL}/spaces/spc_test/_discovery/models/task`) return detail;
                if (options.url === `${BASE_URL}/me/_discovery`) return aggregate;
                throw new Error(`Unexpected request ${options.url}`);
              } },
            };
          }

          test('Fields and Actions use editor-current Record Type before save', async () => {
            const node = new LifeSpace();
            const current = { spaceId: 'spc_test', recordType: RECORD_TYPE, operation: 'create' };
            const saved = { spaceId: 'spc_test', operation: 'create' };
            const fieldsContext = context(current, saved);
            const fields = await node.methods.resourceMapping.getRecordFields.call(fieldsContext);
            assert.deepEqual(fields.fields.map((field) => field.id), ['name']);
            assert.deepEqual(fieldsContext.calls.map((call) => call.url), [`${BASE_URL}/me/_discovery/inventory`, `${BASE_URL}/spaces/spc_test/_discovery/models/task`]);
            const actions = await node.methods.loadOptions.getActions.call(context(current, saved));
            assert.deepEqual(actions.map((entry) => entry.value), ['complete']);
          });

          test('Empty editor-current Record Type does not reuse stale saved selection', async () => {
            const node = new LifeSpace();
            const c = context({ spaceId: 'spc_test', recordType: '', operation: 'create' }, { spaceId: 'spc_test', recordType: RECORD_TYPE, operation: 'create' });
            const fields = await node.methods.resourceMapping.getRecordFields.call(c);
            assert.deepEqual(fields.fields, []);
            assert.deepEqual(c.calls, []);
          });

          test('Legacy 0.1.3 modelRoute still loads design-time fields', async () => {
            const node = new LifeSpace();
            const c = context({ spaceId: 'spc_test', modelRoute: 'tasks', operation: 'create' });
            const fields = await node.methods.resourceMapping.getRecordFields.call(c);
            assert.deepEqual(fields.fields.map((field) => field.id), ['name']);
            assert.deepEqual(c.calls.map((call) => call.url), [`${BASE_URL}/me/_discovery`]);
          });
          ''')

          readme = Path('README.md')
          marker = 'Execution is deliberately narrower. Get/List/Delete derive the REST route locally from the persisted Record Type selector.'
          text = readme.read_text()
          if marker not in text:
              raise SystemExit('README marker missing')
          readme.write_text(text.replace(marker, 'Design-time callbacks prefer n8n editor-current parameters, so Fields and Actions refresh immediately after Record Type selection. A legacy 0.1.3 `modelRoute` is still readable for design-time compatibility; re-selecting Record Type moves configuration to the composable selector.\n\n' + marker, 1))
          PY

          npm ci
          npm run lint
          npm test
          git diff --check
          git rm .github/workflows/temporary-p0-31-design-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md nodes/LifeSpace/LifeSpace.node.ts nodes/lifespaceDiscovery.ts test/design-time-current-parameters.test.mjs
          git commit -m "fix: restore design-time model detail after 0.1.4"
          git push origin HEAD:fix/0.1.4-design-time-discovery
