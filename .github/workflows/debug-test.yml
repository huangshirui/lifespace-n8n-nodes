name: Debug test diagnostics

on:
  push:
    branches:
      - feature/authority-v3-delegation

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.20.0'
          package-manager-cache: false
      - name: Install pinned npm
        run: npm install --global npm@11.15.0
      - name: Install dependencies
        run: npm ci
      - name: Capture test diagnostics
        shell: bash
        run: |
          set +e
          npm test > test-output.txt 2>&1
          echo $? > test-exit-code.txt
          exit 0
      - name: Upload test diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: test-debug
          path: |
            test-output.txt
            test-exit-code.txt
          if-no-files-found: error
