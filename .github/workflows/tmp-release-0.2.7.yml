name: Temporary bump 0.2.7

on:
  push:
    branches: [release/0.2.7]

permissions:
  contents: write

jobs:
  bump:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: release/0.2.7
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Generate consistent package metadata
        run: |
          set -euo pipefail
          npm version 0.2.7 --no-git-tag-version
          node - <<'NODE'
          const p = require('./package.json');
          const l = require('./package-lock.json');
          if (p.version !== '0.2.7' || l.version !== '0.2.7' || l.packages[''].version !== '0.2.7') {
            throw new Error('0.2.7 version metadata is inconsistent');
          }
          NODE
      - name: Commit version files
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m 'chore(release): bump to 0.2.7'
          git push origin HEAD:release/0.2.7
