name: Bootstrap 0.1.2 version bump

on:
  push:
    branches:
      - release/0.1.2
    paths:
      - .github/workflows/release-012-bootstrap.yml

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.22.0'
          package-manager-cache: false
      - run: npm install --global npm@11.15.0
      - name: Bump package and lockfile version
        run: npm version 0.1.2 --no-git-tag-version
      - name: Commit version bump and remove bootstrap workflow
        run: |
          rm .github/workflows/release-012-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "chore: prepare 0.1.2 release"
          git push
