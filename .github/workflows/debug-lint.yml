name: Debug lint diagnostics

on:
  push:
    branches:
      - feature/authority-v3-delegation

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.20.0'
          package-manager-cache: false
      - name: Install pinned npm
        run: npm install --global npm@11.15.0
      - name: Install dependencies
        run: npm ci
      - name: Capture lint diagnostics
        shell: bash
        run: |
          set +e
          npm run lint:fix > lint-output.txt 2>&1
          echo $? > lint-exit-code.txt
          git diff -- . ':!.github/workflows/debug-lint.yml' > lint-fix.patch
          exit 0
      - name: Upload lint diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: lint-debug
          path: |
            lint-output.txt
            lint-exit-code.txt
            lint-fix.patch
          if-no-files-found: error
