name: Bootstrap typed runtime UX

on:
  push:
    branches:
      - fix/typed-runtime-ux
    paths:
      - .github/typed-runtime-ux-bootstrap.mjs
      - .github/workflows/typed-runtime-ux-bootstrap.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
      - name: Apply typed Runtime Discovery UX patch
        run: |
          sed -i "s/const marker = '## Compatibility';/const marker = '## LifeSpace contract compatibility';/" .github/typed-runtime-ux-bootstrap.mjs
          node .github/typed-runtime-ux-bootstrap.mjs
      - name: Commit patch and remove bootstrap files
        run: |
          rm .github/typed-runtime-ux-bootstrap.mjs
          rm .github/workflows/typed-runtime-ux-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix: converge generated Record UX on Runtime Discovery"
          git push
