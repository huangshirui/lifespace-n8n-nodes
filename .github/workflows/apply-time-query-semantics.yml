name: Apply Time Semantics transform

on:
  push:
    branches:
      - feat/37-time-query-semantics

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: feat/37-time-query-semantics
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24.20.0'

      - name: Install pinned npm
        run: npm install --global npm@11.15.0

      - name: Sanitize nested TypeScript templates in one-shot transform
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('.github/scripts/one-shot-time-query-semantics.mjs')
          lines = path.read_text().splitlines(keepends=True)
          output = []
          inside_replace_once = False
          inside_multiline_template = False

          def escape_nested(value: str) -> str:
              value = re.sub(r'(?<!\\)`', r'\\`', value)
              value = re.sub(r'(?<!\\)\$\{', r'\\${', value)
              return value

          for line in lines:
              if not inside_replace_once and 'replaceOnce(' in line:
                  inside_replace_once = True

              if inside_replace_once and not inside_multiline_template:
                  match = re.match(r'^(\s*)`', line)
                  if match:
                      start = match.end()
                      line = line[:start] + escape_nested(line[start:])
                      inside_multiline_template = True
                  elif re.fullmatch(r'\s*\);\s*\n?', line):
                      inside_replace_once = False
                  output.append(line)
                  continue

              if inside_multiline_template:
                  if re.fullmatch(r'\s*`,\s*\n?', line):
                      output.append(line)
                      inside_multiline_template = False
                  else:
                      output.append(escape_nested(line))
                  continue

              output.append(line)

          if inside_multiline_template:
              raise SystemExit('unterminated replaceOnce template')

          path.write_text(''.join(output))
          PY
          node --check .github/scripts/one-shot-time-query-semantics.mjs

      - name: Apply one-shot transform
        run: node .github/scripts/one-shot-time-query-semantics.mjs

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Diff check
        run: git diff --check

      - name: Remove one-shot scaffolding
        run: git rm .github/scripts/one-shot-time-query-semantics.mjs .github/workflows/apply-time-query-semantics.yml

      - name: Commit verified implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md nodes test
          git status --short
          git commit -m "feat: project LifeSpace Time Semantics into queries"
          git push origin HEAD:feat/37-time-query-semantics
