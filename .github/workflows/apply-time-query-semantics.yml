name: Apply Time Semantics transform

on:
  push:
    branches:
      - feat/37-time-query-semantics

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: feat/37-time-query-semantics
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24.20.0'

      - name: Install pinned npm
        run: npm install --global npm@11.15.0

      - name: Apply one-shot transform
        run: node .github/scripts/one-shot-time-query-semantics.mjs

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Diff check
        run: git diff --check

      - name: Remove one-shot scaffolding
        run: git rm .github/scripts/one-shot-time-query-semantics.mjs .github/workflows/apply-time-query-semantics.yml

      - name: Commit verified implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md nodes test
          git status --short
          git commit -m "feat: project LifeSpace Time Semantics into queries"
          git push origin HEAD:feat/37-time-query-semantics
