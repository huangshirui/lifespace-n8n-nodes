name: Temporary publish 0.2.7

on:
  push:
    branches: [release/publish-0.2.7]

permissions:
  actions: write
  contents: write

jobs:
  dispatch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: release/publish-0.2.7
          fetch-depth: 0
      - name: Verify release tag before dispatch
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_SHA='1a429e6cd500f71080ec7f14573b377a2d0cbb6b'
          git fetch origin main --tags
          test "$(git rev-parse origin/main)" = "$EXPECTED_SHA"
          test "$(git rev-parse 0.2.7)" = "$EXPECTED_SHA"
          VERSION="$(git show 0.2.7:package.json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).version))")"
          test "$VERSION" = '0.2.7'
      - name: Dispatch Publish at tag 0.2.7
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/publish.yml/dispatches \
            -d '{"ref":"0.2.7"}'
      - name: Remove temporary helper from branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/tmp-publish-0.2.7.yml
          git commit -m 'chore: remove temporary 0.2.7 publish helper'
          git push origin HEAD:release/publish-0.2.7
