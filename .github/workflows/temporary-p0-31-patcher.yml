name: Temporary P0 31 patcher

on:
  push:
    branches:
      - fix/0.1.4-design-time-discovery

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/0.1.4-design-time-discovery
      - name: Apply and verify P0 regression fix
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          def replace_once(path, label, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              print(f'{label}: {count} match(es)')
              if count != 1:
                  raise SystemExit(f'{path} / {label}: expected exactly one match, found {count}')
              p.write_text(text.replace(old, new, 1))

          def replace_all(path, label, old, new, expected):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              print(f'{label}: {count} match(es)')
              if count != expected:
                  raise SystemExit(f'{path} / {label}: expected {expected} matches, found {count}')
              p.write_text(text.replace(old, new))

          discovery = 'nodes/lifespaceDiscovery.ts'
          replace_once(discovery, 'current design-time parameter resolver', """function loadOptionParameter(context: ILoadOptionsFunctions, name: string): string {
            try {
              return String(context.getNodeParameter(name, '') ?? '').trim();
            } catch {
              return '';
            }
          }""", """export function loadOptionParameter(context: ILoadOptionsFunctions, name: string): string {
            try {
              const current = context.getCurrentNodeParameter(name);
              if (current !== undefined) return String(current ?? '').trim();
            } catch {
              // Fall through for compatible contexts that do not expose an editor-current value.
            }
            try {
              return String(context.getNodeParameter(name, '') ?? '').trim();
            } catch {
              return '';
            }
          }""")

          replace_once(discovery, 'legacy design-time discovery fallback', """  const recordType = loadOptionParameter(this, 'recordType');
            const decodedRecordType = recordType ? decodeRecordTypeSelector(recordType) : null;
            if (recordType && !decodedRecordType) {
              throw new NodeOperationError(this.getNode(), 'LifeSpace Record Type selector is invalid. Choose a Record Type from Discovery or pass a Trigger recordType value.');
            }
            const selection = {
              spaceId: loadOptionParameter(this, 'spaceId'),
              modelKey: decodedRecordType?.modelKey ?? '',
            };
            const progressive = await requestProgressiveRuntimeDiscovery(this, baseUrl, selection);
            return progressive ?? requestFullRuntimeDiscovery(this, baseUrl);""", """  const recordType = loadOptionParameter(this, 'recordType');
            const decodedRecordType = recordType ? decodeRecordTypeSelector(recordType) : null;
            if (recordType && !decodedRecordType) {
              throw new NodeOperationError(this.getNode(), 'LifeSpace Record Type selector is invalid. Choose a Record Type from Discovery or pass a Trigger recordType value.');
            }
            const legacyModelRoute = recordType ? '' : loadOptionParameter(this, 'modelRoute');
            if (legacyModelRoute) return requestFullRuntimeDiscovery(this, baseUrl);
            const selection = {
              spaceId: loadOptionParameter(this, 'spaceId'),
              modelKey: decodedRecordType?.modelKey ?? '',
            };
            const progressive = await requestProgressiveRuntimeDiscovery(this, baseUrl, selection);
            return progressive ?? requestFullRuntimeDiscovery(this, baseUrl);""")

          node = 'nodes/LifeSpace/LifeSpace.node.ts'
          replace_once(node, 'import current parameter helper', """  loadExecutionRuntimeDiscovery,
            loadRelationTargets,""", """  loadExecutionRuntimeDiscovery,
            loadOptionParameter,
            loadRelationTargets,""")

          replace_once(node, 'legacy-aware execution model', """async function executionModel(
            context: IExecuteFunctions,
            itemIndex: number,
            baseUrl: string,
            spaceId: string,
            modelKey: string,
          ): Promise<DiscoveryModel> {
            const discovery = await loadExecutionRuntimeDiscovery(context, baseUrl, spaceId, modelKey);
            const model = discoveryModel(discovery, spaceId, modelKey);
            if (!model) {
              throw new NodeOperationError(context.getNode(), `LifeSpace Record Type ${modelKey} is not available`, { itemIndex });
            }
            return model;
          }""", """async function executionModel(
            context: IExecuteFunctions,
            itemIndex: number,
            baseUrl: string,
            spaceId: string,
            modelKey: string,
            modelRoute: string,
          ): Promise<DiscoveryModel> {
            const discovery = await loadExecutionRuntimeDiscovery(context, baseUrl, spaceId, modelKey || undefined);
            const model = modelKey
              ? discoveryModel(discovery, spaceId, modelKey)
              : discoverySpace(discovery, spaceId)?.models.find((entry) => entry.route === modelRoute);
            if (!model) {
              throw new NodeOperationError(context.getNode(), `LifeSpace Record Type ${modelKey || modelRoute} is not available`, { itemIndex });
            }
            return model;
          }""")

          replace_once(node, 'action modelRoute argument', """  modelKey: string,
            recordPath: string,
            actionKey: string,""", """  modelKey: string,
            modelRoute: string,
            recordPath: string,
            actionKey: string,""")
          replace_once(node, 'action execution model lookup', """  const model = await executionModel(context, itemIndex, baseUrl, spaceId, modelKey);""", """  const model = await executionModel(context, itemIndex, baseUrl, spaceId, modelKey, modelRoute);""")

          replace_once(node, 'editor-current option model', """async function optionModel(context: ILoadOptionsFunctions): Promise<{ model: DiscoveryModel; spaceId: string } | null> {
            const spaceId = String(context.getNodeParameter('spaceId', '')).trim();
            const recordTypeValue = String(context.getNodeParameter('recordType', '')).trim();
            if (!spaceId || !recordTypeValue) return null;
            const recordType = decodeRecordTypeSelector(recordTypeValue);
            if (!recordType) {
              throw new NodeOperationError(context.getNode(), 'LifeSpace Record Type selector is invalid. Choose a Record Type from Discovery or pass a Trigger recordType value.');
            }
            const discovery = await loadRuntimeDiscovery.call(context);
            const model = discoveryModel(discovery, spaceId, recordType.modelKey);
            return model ? { model, spaceId } : null;
          }""", """async function optionModel(context: ILoadOptionsFunctions): Promise<{ model: DiscoveryModel; spaceId: string } | null> {
            const spaceId = loadOptionParameter(context, 'spaceId');
            const recordTypeValue = loadOptionParameter(context, 'recordType');
            const legacyModelRoute = recordTypeValue ? '' : loadOptionParameter(context, 'modelRoute');
            if (!spaceId || (!recordTypeValue && !legacyModelRoute)) return null;
            const recordType = recordTypeValue ? decodeRecordTypeSelector(recordTypeValue) : null;
            if (recordTypeValue && !recordType) {
              throw new NodeOperationError(context.getNode(), 'LifeSpace Record Type selector is invalid. Choose a Record Type from Discovery or pass a Trigger recordType value.');
            }
            const discovery = await loadRuntimeDiscovery.call(context);
            const space = discoverySpace(discovery, spaceId);
            const model = recordType
              ? discoveryModel(discovery, spaceId, recordType.modelKey)
              : space?.models.find((entry) => entry.route === legacyModelRoute);
            return model ? { model, spaceId } : null;
          }""")

          replace_once(node, 'relation operation current value', """  const operation = String(context.getNodeParameter('operation', 'create'));""", """  const operation = loadOptionParameter(context, 'operation') || 'create';""")
          replace_once(node, 'record type list current space', """        const spaceId = String(this.getNodeParameter('spaceId', '')).trim();""", """        const spaceId = loadOptionParameter(this, 'spaceId');""")
          replace_once(node, 'record type list current operation', """        const operation = String(this.getNodeParameter('operation', 'list'));""", """        const operation = loadOptionParameter(this, 'operation') || 'list';""")
          replace_all(node, 'mapper current operation', """        const operation = String(this.getNodeParameter('operation', 'create'));""", """        const operation = loadOptionParameter(this, 'operation') || 'create';""", 2)
          replace_once(node, 'action input current key', """        const actionKey = String(this.getNodeParameter('actionKey', '')).trim();""", """        const actionKey = loadOptionParameter(this, 'actionKey');""")

          replace_once(node, 'execution selector compatibility', """          const rawSpaceId = String(this.getNodeParameter('spaceId', itemIndex));
                  const recordType = decodeRecordTypeSelector(this.getNodeParameter('recordType', itemIndex));
                  if (!recordType) {
                    throw new NodeOperationError(
                      this.getNode(),
                      'LifeSpace Record Type selector is invalid. Choose a Record Type from Discovery or pass a Trigger recordType value.',
                      { itemIndex },
                    );
                  }
                  const rawModelKey = recordType.modelKey;
                  const rawModelRoute = recordType.route;""", """          const rawSpaceId = String(this.getNodeParameter('spaceId', itemIndex));
                  const recordTypeValue = this.getNodeParameter('recordType', itemIndex, '');
                  const recordType = decodeRecordTypeSelector(recordTypeValue);
                  const legacyModelRoute = recordType ? '' : String(this.getNodeParameter('modelRoute', itemIndex, '') ?? '').trim();
                  if (!recordType && !legacyModelRoute) {
                    throw new NodeOperationError(
                      this.getNode(),
                      'LifeSpace Record Type selector is invalid or missing. Re-select the Record Type or pass a Trigger recordType value.',
                      { itemIndex },
                    );
                  }
                  const rawModelKey = recordType?.modelKey ?? '';
                  const rawModelRoute = recordType?.route ?? legacyModelRoute;""")

          replace_once(node, 'pass action model route', """                  rawModelKey,
                      recordPath,
                      rawActionKey,""", """                  rawModelKey,
                      rawModelRoute,
                      recordPath,
                      rawActionKey,""")

          test_file = Path('test/design-time-current-parameters.test.mjs')
          test_file.write_text(r'''import assert from 'node:assert/strict';
          import { createRequire } from 'node:module';
          import { test } from 'node:test';

          const require = createRequire(import.meta.url);
          const { LifeSpace } = require('../dist/nodes/LifeSpace/LifeSpace.node.js');
          const { encodeRecordTypeSelector } = require('../dist/nodes/lifespaceDiscovery.js');

          const BASE_URL = 'https://example.invalid/api/v1';
          const RECORD_TYPE = encodeRecordTypeSelector('task', 'tasks');
          const detailModel = {
            key: 'task', route: 'tasks', version: 1, schemaHash: 'sha256:task',
            display: { singular: 'Task', plural: 'Tasks' }, description: 'Task',
            access: ['read', 'write'],
            fields: [{ key: 'name', type: 'string', title: 'Name', required: true }],
            defaults: {},
            query: { searchable: ['name'], filterable: [], sortable: [], sort: { parameter: 'sort', syntax: 'field:direction', repeatable: true, ordered: true, maxCriteria: 8, default: ['createdAt:desc'], envelopeFields: ['createdAt', 'updatedAt'] } },
            actions: [{ key: 'complete', access: 'write', kind: 'workflow', input: { fields: [] } }],
            capabilities: [], capabilityBindings: {},
          };
          const inventory = { data: {
            semanticDetailPathTemplate: '/api/v1/spaces/{spaceId}/_discovery/models/{modelKey}',
            models: [{ key: 'task', route: 'tasks', version: 1, schemaHash: 'sha256:task', display: { singular: 'Task', plural: 'Tasks' }, capabilities: [], actions: [{ key: 'complete', access: 'write', kind: 'workflow' }] }],
            spaces: [{ spaceId: 'spc_test', spaceName: 'Test', models: [{ modelKey: 'task', access: ['read', 'write'] }] }],
          } };
          const detail = { data: {
            key: 'task', route: 'tasks', version: 1, schemaHash: 'sha256:task', display: { singular: 'Task', plural: 'Tasks' }, description: 'Task', declaredAccess: ['read', 'write'],
            fields: [{ key: 'name', type: 'string', title: 'Name', required: true }], defaults: {},
            query: { searchable: ['name'], filterable: [], sortable: [], sort: { parameter: 'sort', syntax: 'field:direction', repeatable: true, ordered: true, maxCriteria: 8, genericDefault: ['createdAt:desc'], envelopeFields: ['createdAt', 'updatedAt'] } },
            actions: [{ key: 'complete', access: 'write', kind: 'workflow', input: { fields: [] } }], capabilities: [], capabilityBindings: {},
          } };
          const aggregate = { data: { spaces: [{ spaceId: 'spc_test', spaceName: 'Test', models: [detailModel] }] } };

          function designContext(current, saved = current) {
            const calls = [];
            return {
              calls,
              getCredentials: async () => ({ baseUrl: `${BASE_URL}/` }),
              getNodeParameter(name, defaultValue) { return Object.prototype.hasOwnProperty.call(saved, name) ? saved[name] : defaultValue; },
              getCurrentNodeParameter(name) { return Object.prototype.hasOwnProperty.call(current, name) ? current[name] : undefined; },
              getCurrentNodeParameters() { return current; },
              getNode: () => ({ name: 'LifeSpace' }),
              helpers: { async httpRequestWithAuthentication(_credential, options) {
                calls.push(options);
                if (options.url === `${BASE_URL}/me/_discovery/inventory`) return inventory;
                if (options.url === `${BASE_URL}/spaces/spc_test/_discovery/models/task`) return detail;
                if (options.url === `${BASE_URL}/me/_discovery`) return aggregate;
                throw new Error(`Unexpected ${options.method} ${options.url}`);
              } },
            };
          }

          test('Fields and Actions read editor-current Record Type before save', async () => {
            const node = new LifeSpace();
            const current = { spaceId: 'spc_test', recordType: RECORD_TYPE, operation: 'create' };
            const saved = { spaceId: 'spc_test', operation: 'create' };
            const fieldContext = designContext(current, saved);
            const fields = await node.methods.resourceMapping.getRecordFields.call(fieldContext);
            assert.deepEqual(fields.fields.map((field) => field.id), ['name']);
            assert.deepEqual(fieldContext.calls.map((call) => call.url), [`${BASE_URL}/me/_discovery/inventory`, `${BASE_URL}/spaces/spc_test/_discovery/models/task`]);

            const actionContext = designContext(current, saved);
            const actions = await node.methods.loadOptions.getActions.call(actionContext);
            assert.deepEqual(actions.map((action) => action.value), ['complete']);
          });

          test('Clearing editor-current Record Type does not fall back to a stale saved selector', async () => {
            const node = new LifeSpace();
            const context = designContext({ spaceId: 'spc_test', recordType: '', operation: 'create' }, { spaceId: 'spc_test', recordType: RECORD_TYPE, operation: 'create' });
            const fields = await node.methods.resourceMapping.getRecordFields.call(context);
            assert.deepEqual(fields.fields, []);
            assert.deepEqual(context.calls, []);
          });

          test('0.1.3 modelRoute remains available for design-time model detail', async () => {
            const node = new LifeSpace();
            const context = designContext({ spaceId: 'spc_test', modelRoute: 'tasks', operation: 'create' });
            const fields = await node.methods.resourceMapping.getRecordFields.call(context);
            assert.deepEqual(fields.fields.map((field) => field.id), ['name']);
            assert.deepEqual(context.calls.map((call) => call.url), [`${BASE_URL}/me/_discovery`]);
          });
          ''')

          readme = Path('README.md')
          marker = 'Execution is deliberately narrower. Get/List/Delete derive the REST route locally from the persisted Record Type selector.'
          text = readme.read_text()
          if marker not in text:
              raise SystemExit('README compatibility marker missing')
          readme.write_text(text.replace(marker, 'Design-time callbacks prefer n8n editor-current parameters, so Fields and Actions refresh immediately after Record Type selection. Workflows saved by 0.1.3 with the legacy `modelRoute` parameter remain readable as a compatibility fallback; re-selecting Record Type moves them to the composable selector.\n\n' + marker, 1))
          PY

          npm ci
          npm run lint
          npm test
          git diff --check
          git rm .github/workflows/temporary-p0-31-patcher.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md nodes/LifeSpace/LifeSpace.node.ts nodes/lifespaceDiscovery.ts test/design-time-current-parameters.test.mjs
          git commit -m "fix: restore design-time model detail after 0.1.4"
          git push origin HEAD:fix/0.1.4-design-time-discovery
