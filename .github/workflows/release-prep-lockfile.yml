name: Release prep lockfile

on:
  push:
    branches:
      - release/0.2.4

permissions:
  contents: write

jobs:
  align-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/0.2.4
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'

      - name: Align package-lock version
        run: npm version 0.2.4 --no-git-tag-version --allow-same-version

      - name: Commit generated lockfile change
        run: |
          if git diff --quiet -- package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: align lockfile version to 0.2.4"
          git push origin HEAD:release/0.2.4
