name: Security Audit Baseline

on:
  push:
    branches:
      - chore/dev-dependency-security-baseline
    paths:
      - .github/workflows/security-audit-baseline.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.22.0'
          package-manager-cache: false
      - run: npm install --global npm@11.15.0
      - run: npm ci
      - name: Apply candidate direct dependency upgrades
        run: npm install --save-dev @n8n/node-cli@0.47.0 release-it@21.0.2 prettier@3.9.6
      - name: Show candidate package changes
        run: git diff -- package.json package-lock.json
      - name: Capture candidate npm audit
        run: npm audit --json > audit.json || true
      - name: Summarize candidate npm audit
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('audit.json', 'utf8'));
          console.log('VULNERABILITY_COUNTS', JSON.stringify(report.metadata?.vulnerabilities ?? {}));
          for (const [name, vuln] of Object.entries(report.vulnerabilities ?? {}).sort(([a], [b]) => a.localeCompare(b))) {
            const via = (vuln.via ?? []).map((entry) => typeof entry === 'string' ? entry : `${entry.name}:${entry.severity}:${entry.range}`).join(', ');
            console.log(JSON.stringify({
              name,
              severity: vuln.severity,
              direct: vuln.isDirect,
              range: vuln.range,
              via,
              effects: vuln.effects,
              fixAvailable: vuln.fixAvailable,
            }));
          }
          NODE
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
