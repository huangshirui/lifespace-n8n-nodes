name: Security Audit Baseline

on:
  push:
    branches:
      - chore/dev-dependency-security-baseline
    paths:
      - .github/workflows/security-audit-baseline.yml

permissions:
  contents: write

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: chore/dev-dependency-security-baseline
      - uses: actions/setup-node@v5
        with:
          node-version: '22.22.0'
          package-manager-cache: false
      - run: npm install --global npm@11.15.0
      - run: npm ci
      - name: Apply stable dependency baseline
        run: |
          npm uninstall --save-dev release-it
          npm install --save-dev @n8n/node-cli@0.46.4 prettier@3.9.6
      - name: Capture npm audit
        run: npm audit --json > audit.json || true
      - name: Summarize npm audit
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('audit.json', 'utf8'));
          console.log('VULNERABILITY_COUNTS', JSON.stringify(report.metadata?.vulnerabilities ?? {}));
          for (const [name, vuln] of Object.entries(report.vulnerabilities ?? {}).sort(([a], [b]) => a.localeCompare(b))) {
            const via = (vuln.via ?? []).map((entry) => typeof entry === 'string' ? entry : `${entry.name}:${entry.severity}:${entry.range}`).join(', ');
            console.log(JSON.stringify({ name, severity: vuln.severity, direct: vuln.isDirect, range: vuln.range, via, effects: vuln.effects, fixAvailable: vuln.fixAvailable }));
          }
          NODE
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Commit baseline
        run: |
          rm .github/workflows/security-audit-baseline.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json package-lock.json .github/workflows/security-audit-baseline.yml
          git commit -m "chore: refresh development dependency security baseline"
          git push origin HEAD:chore/dev-dependency-security-baseline
