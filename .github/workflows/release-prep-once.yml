name: Release Prep Once

on:
  push:
    branches:
      - 'release/0.2.1'

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v5
        with:
          ref: release/0.2.1

      - name: Set package metadata to 0.2.1
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const version = '0.2.1';
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          pkg.version = version;
          lock.version = version;
          lock.packages[''].version = version;
          fs.writeFileSync('package.json', `${JSON.stringify(pkg, null, 2)}\n`);
          fs.writeFileSync('package-lock.json', `${JSON.stringify(lock, null, 2)}\n`);
          NODE
          test "$(node -p "require('./package.json').version")" = '0.2.1'
          test "$(node -p "require('./package-lock.json').version")" = '0.2.1'
          test "$(node -p "require('./package-lock.json').packages[''].version")" = '0.2.1'

      - name: Commit prepared metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo 'Package metadata already prepared.'
            exit 0
          fi
          git commit -m 'release: prepare 0.2.1'
          git push origin HEAD:release/0.2.1
