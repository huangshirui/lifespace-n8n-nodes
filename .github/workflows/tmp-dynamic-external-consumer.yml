name: Temporary dynamic External consumer convergence

on:
  push:
    branches:
      - fix/dynamic-external-consumer

permissions:
  contents: write

jobs:
  converge:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: fix/dynamic-external-consumer

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24.20.0'

      - name: Apply convergence
        run: |
          python3 scripts/tmp_dynamic_external_consumer.py
          python3 scripts/tmp_dynamic_external_consumer_fix.py

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Remove temporary convergence machinery
        run: |
          rm scripts/tmp_dynamic_external_consumer.py
          rm scripts/tmp_dynamic_external_consumer_fix.py
          rm .github/workflows/tmp-dynamic-external-consumer.yml

      - name: Commit verified changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: consume dynamic External models generically'
          git push origin HEAD:fix/dynamic-external-consumer
