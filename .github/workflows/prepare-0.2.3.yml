name: Prepare 0.2.3 release

on:
  push:
    branches:
      - release/0.2.3

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v5
        with:
          ref: release/0.2.3

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.20.0'
          cache: npm

      - name: Bump package metadata
        run: npm version 0.2.3 --no-git-tag-version

      - name: Verify package versions
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./package.json').version")"
          lock_version="$(node -p "require('./package-lock.json').version")"
          lock_root_version="$(node -p "require('./package-lock.json').packages[''].version")"
          test "$package_version" = "0.2.3"
          test "$lock_version" = "$package_version"
          test "$lock_root_version" = "$package_version"
          echo "package=${package_version} lock=${lock_version} root=${lock_root_version}"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Pack dry-run
        run: npm pack --dry-run

      - name: Remove one-shot workflow
        run: rm .github/workflows/prepare-0.2.3.yml

      - name: Commit validated release metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json .github/workflows/prepare-0.2.3.yml
          git commit -m "release: prepare 0.2.3"
          git push origin HEAD:release/0.2.3
