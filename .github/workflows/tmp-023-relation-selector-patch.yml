name: Temporary 0.23 relation selector patch

on:
  push:
    branches:
      - feature/lifespace-023-relation-selectors

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/lifespace-023-relation-selectors
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - name: Apply adapter patch
        run: python3 scripts/tmp-023-relation-selector-patch.py
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Diff hygiene
        run: git diff --check
      - name: Commit verified adapter changes
        run: |
          if git diff --quiet -- nodes/LifeSpace/LifeSpace.node.ts test/contract.test.mjs; then
            echo "Adapter already patched"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nodes/LifeSpace/LifeSpace.node.ts test/contract.test.mjs
          git commit -m "feat: render LifeSpace 0.23 Person relation selectors"
          git push origin HEAD:feature/lifespace-023-relation-selectors
