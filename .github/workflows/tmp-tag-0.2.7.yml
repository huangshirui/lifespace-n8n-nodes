name: Temporary tag 0.2.7

on:
  push:
    branches: [release/tag-0.2.7]

permissions:
  contents: write

jobs:
  tag:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: release/tag-0.2.7
          fetch-depth: 0
      - name: Verify exact main release commit
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_SHA='1a429e6cd500f71080ec7f14573b377a2d0cbb6b'
          git fetch origin main --tags
          ACTUAL_SHA="$(git rev-parse origin/main)"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA" || { echo "main moved: $ACTUAL_SHA" >&2; exit 1; }
          VERSION="$(git show "$EXPECTED_SHA":package.json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).version))")"
          test "$VERSION" = '0.2.7' || { echo "package version mismatch: $VERSION" >&2; exit 1; }
          if git ls-remote --exit-code --tags origin refs/tags/0.2.7 >/dev/null 2>&1; then
            echo 'tag 0.2.7 already exists' >&2
            exit 1
          fi
      - name: Create exact release tag
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_SHA='1a429e6cd500f71080ec7f14573b377a2d0cbb6b'
          git tag 0.2.7 "$EXPECTED_SHA"
          test "$(git rev-parse 0.2.7)" = "$EXPECTED_SHA"
          git push origin refs/tags/0.2.7
      - name: Remove temporary helper from branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/tmp-tag-0.2.7.yml
          git commit -m 'chore: remove temporary 0.2.7 tag helper'
          git push origin HEAD:release/tag-0.2.7
