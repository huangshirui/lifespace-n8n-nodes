name: Record Type Help Finalize

on:
  push:
    branches:
      - fix/model-key-workflow-composability
    paths:
      - .github/workflows/record-type-help-finalize.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/model-key-workflow-composability
      - uses: actions/setup-node@v5
        with:
          node-version: '22.22.0'
          package-manager-cache: false
      - run: npm install --global npm@11.15.0
      - name: Apply n8n-compliant help text
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('nodes/LifeSpace/LifeSpace.node.ts')
          source = path.read_text()
          old = 'Choose from Discovery, or pass the recordType selector emitted by a LifeSpace Trigger using an <a href="https://docs.n8n.io/code/expressions/">expression</a>. Choose from the list, or specify an ID using an <a href="https://docs.n8n.io/code/expressions/">expression</a>.'
          new = 'Choose from the list, or specify an ID using an <a href="https://docs.n8n.io/code/expressions/">expression</a>'
          if old not in source:
            raise SystemExit('Record Type help text target not found')
          path.write_text(source.replace(old, new, 1))
          Path('.github/workflows/record-type-description-bootstrap.yml').unlink(missing_ok=True)
          Path('.github/workflows/record-type-help-finalize.yml').unlink(missing_ok=True)
          PY
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Commit cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "docs: normalize record type help text"
          git push origin HEAD:fix/model-key-workflow-composability
