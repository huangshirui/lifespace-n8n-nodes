name: Prepare 0.1.9

on:
  push:
    branches:
      - release/0.1.9

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: release/0.1.9

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24.20.0'

      - name: Bump package metadata
        run: npm version 0.1.9 --no-git-tag-version

      - name: Commit release metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "Release metadata already at 0.1.9"
            exit 0
          fi
          git commit -m "chore: prepare 0.1.9 release metadata"
          git push origin HEAD:release/0.1.9
