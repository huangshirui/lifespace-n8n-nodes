name: Release 0.1.9

on:
  push:
    branches:
      - release/0.1.9

permissions:
  contents: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Create GitHub release and tag
        shell: bash
        run: |
          set -euo pipefail
          if gh release view 0.1.9 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release 0.1.9 already exists"
          else
            gh release create 0.1.9 \
              --repo "$GITHUB_REPOSITORY" \
              --target 4154ae652fdbc78213356fa09d9d53e5de1eb27b \
              --title "0.1.9" \
              --notes "Create-node test round: explicit field presence/server defaults, required-first Create UX, improved LifeSpace error projection, and Related People & Records labeling."
          fi

      - name: Dispatch provenance publish workflow
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run publish.yml --repo "$GITHUB_REPOSITORY" --ref 0.1.9
