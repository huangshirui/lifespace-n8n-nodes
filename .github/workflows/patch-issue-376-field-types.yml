name: temp-patch

on: [push]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-376-field-types
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: npm
      - run: python scripts/apply-issue-376-field-types.py
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - name: Commit verified source patch
        run: |
          rm scripts/apply-issue-376-field-types.py
          rm .github/workflows/patch-issue-376-field-types.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: support LifeSpace collection field types"
          git push origin HEAD:issue-376-field-types
