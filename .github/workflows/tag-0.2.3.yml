name: Tag 0.2.3 and dispatch publish

on:
  push:
    branches:
      - release/0.2.3

permissions:
  contents: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v5
        with:
          ref: release/0.2.3
          fetch-depth: 0

      - name: Verify exact released main commit
        shell: bash
        run: |
          set -euo pipefail
          expected_sha="406d00faf2281ec10014a53879c539ff2e14cb8b"
          git fetch origin main --tags --force
          actual_sha="$(git rev-parse origin/main)"
          test "$actual_sha" = "$expected_sha" || { echo "main moved: expected $expected_sha, got $actual_sha" >&2; exit 1; }

          package_version="$(git show origin/main:package.json | jq -r '.version')"
          lock_version="$(git show origin/main:package-lock.json | jq -r '.version')"
          lock_root_version="$(git show origin/main:package-lock.json | jq -r '.packages[""].version')"
          test "$package_version" = "0.2.3"
          test "$lock_version" = "0.2.3"
          test "$lock_root_version" = "0.2.3"
          echo "verified main=$actual_sha package=$package_version lock=$lock_version root=$lock_root_version"

      - name: Create exact 0.2.3 tag if absent
        shell: bash
        run: |
          set -euo pipefail
          expected_sha="406d00faf2281ec10014a53879c539ff2e14cb8b"
          existing="$(git ls-remote --tags origin refs/tags/0.2.3 | awk '{print $1}')"
          if [ -n "$existing" ]; then
            test "$existing" = "$expected_sha" || { echo "0.2.3 already exists on unexpected $existing" >&2; exit 1; }
            echo "0.2.3 already points to verified main commit"
          else
            git tag 0.2.3 "$expected_sha"
            test "$(git rev-parse 0.2.3)" = "$expected_sha"
            git push origin refs/tags/0.2.3
          fi

      - name: Dispatch trusted Publish workflow on tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/publish.yml/dispatches" \
            -d '{"ref":"0.2.3"}'
          echo "Publish workflow dispatched for ref 0.2.3"

      - name: Remove one-shot tagging workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tag-0.2.3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/tag-0.2.3.yml
          git commit -m "chore: remove one-shot 0.2.3 tagging workflow"
          git push origin HEAD:release/0.2.3
