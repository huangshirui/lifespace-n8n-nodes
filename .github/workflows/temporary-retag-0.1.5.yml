name: Temporary retag 0.1.5

on:
  push:
    branches:
      - main

jobs:
  retag:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Finalize clean commit and retag
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p "require('./package.json').version")" = "0.1.5"
          test "$(node -p "require('./package-lock.json').version")" = "0.1.5"
          git rm .github/workflows/temporary-retag-0.1.5.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: finalize 0.1.5 release metadata"
          git push origin HEAD:main
          git tag -f 0.1.5 HEAD
          git push --force origin refs/tags/0.1.5
