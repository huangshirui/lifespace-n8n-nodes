name: temp-file-upload-capability

on:
  push:
    branches: [feat/file-upload-capability]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/file-upload-capability
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24.20.0'
      - name: Install pinned npm
        run: npm install --global npm@11.15.0
      - name: Install dependencies
        run: npm ci
      - name: Apply File capability integration
        run: node scripts/apply-file-upload-capability.mjs
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Commit verified implementation
        run: |
          rm -f scripts/apply-file-upload-capability.mjs .github/workflows/temp-file-upload-capability.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(n8n): support LifeSpace File upload capability"
          git push origin HEAD:feat/file-upload-capability
