name: Apply n8n 0.2.0 closeout

on:
  push:
    branches:
      - "feat/0.2.0-authorization"

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: "feat/0.2.0-authorization"
      - uses: actions/setup-node@v5
        with:
          node-version: "24.20.0"
      - name: Apply closeout transform
        run: |
          python3 scripts/closeout_020.py
          python3 scripts/fix_020_lint.py
      - name: Update version metadata
        run: npm version 0.2.0 --no-git-tag-version
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Commit closeout
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AGENTS.md package.json package-lock.json nodes test
          git diff --cached --quiet && exit 0
          git commit -m "feat: complete 0.2.0 authority and bulk surface"
          git push origin HEAD:feat/0.2.0-authorization
