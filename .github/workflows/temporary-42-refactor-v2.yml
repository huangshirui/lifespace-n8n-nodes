name: Temporary #42 refactor v2

on:
  push:
    branches:
      - fix/42-0.1.8-query-tool-regression

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24.20.0'
          package-manager-cache: false
      - name: Apply and verify #42 fix
        shell: bash
        run: |
          set -euo pipefail
          git checkout 08ba83fa9deeed6037e6bb3d8a96c523ac4ba634 -- README.md nodes/lifespaceDiscovery.ts
          git rm -r nodes/LifeSpaceTool nodes/agent/lifeSpaceToolFactory.ts test/agent-tool-source-contract.test.mjs test/agent-tool.test.mjs

          python <<'PY'
          from pathlib import Path
          from textwrap import dedent
          import json

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              return text.replace(old, new, 1)

          def replace_section(text, start_marker, end_marker, replacement, label):
              start = text.find(start_marker)
              if start < 0:
                  raise SystemExit(f'{label}: start marker not found')
              end = text.find(end_marker, start + len(start_marker))
              if end < 0:
                  raise SystemExit(f'{label}: end marker not found')
              return text[:start] + replacement + text[end:]

          node_path = Path('nodes/LifeSpace/LifeSpace.node.ts')
          node = node_path.read_text()

          prelude = """  const qs: IDataObject = {};
            const configuredQueryMode = String(context.getNodeParameter('queryMode', itemIndex, '') ?? '').trim();
            const legacyCapabilityQueryKey = String(context.getNodeParameter('semanticQueryKey', itemIndex, '') ?? '').trim();
            const rawCapabilityQueryInput = mappedValue(context, itemIndex, 'semanticQueryInput');
            const rawCapabilitySort = String(context.getNodeParameter('semanticSort', itemIndex, '') ?? '').trim();
            const hasLegacyCapabilityConfiguration = legacyCapabilityQueryKey !== ''
              || Object.keys(rawCapabilityQueryInput).length > 0
              || rawCapabilitySort !== '';
            const queryMode = configuredQueryMode || (hasLegacyCapabilityConfiguration ? 'capability' : 'standard');
            const useStandardQuery = queryMode !== 'capability';
            const useCapabilityQuery = queryMode === 'capability';
            const search = useStandardQuery ? String(context.getNodeParameter('search', itemIndex, '')).trim() : '';
            const options = context.getNodeParameter('options', itemIndex, {}) as IDataObject;
            const configuredSorts = useStandardQuery
              ? context.getNodeParameter('sorts.sort', itemIndex, []) as QuerySort[]
              : [];
            const semanticSort = useCapabilityQuery ? rawCapabilitySort : '';
            const legacySortField = useStandardQuery ? String(options.sortField ?? '').trim() : '';
            const legacySortDirection = String(options.sortDirection ?? 'desc').trim();
            const configuredCursor = String(options.cursor ?? '').trim();
            const cursor = cursorOverride ?? configuredCursor;
            const filters = useStandardQuery
              ? context.getNodeParameter('filters.filter', itemIndex, []) as QueryFilter[]
              : [];

          """
          node = replace_section(
              node,
              "  const qs: IDataObject = {};\n",
              "  if (search) qs.q = search;\n",
              prelude,
              'query execution prelude',
          )
          node = replace_once(
              node,
              "  const typedFilters = context.getNodeParameter('filters', itemIndex, {}) as IDataObject;",
              "  const typedFilters = useStandardQuery\n    ? context.getNodeParameter('filters', itemIndex, {}) as IDataObject\n    : {};",
              'generic filter execution gate',
          )

          local_block = """  const localDateWindows = useStandardQuery
            ? [
                ...((typedFilters.localDateWindow ?? []) as QueryLocalDateWindow[]),
                ...(context.getNodeParameter('localDateWindows.window', itemIndex, []) as QueryLocalDateWindow[]),
              ]
            : [];
            for (const row of localDateWindows) {
              const selector = decodeLocalDateWindowSelector(row.field);
              if (!selector) {
                if (String(row.field ?? '').trim()) {
                  throw new NodeOperationError(context.getNode(), 'Local Date Window selector is invalid. Re-select the field from Runtime Discovery.', { itemIndex });
                }
                continue;
              }
              const dateStart = dateOnlyValue(context, itemIndex, row.dateStart, selector.field);
              const dateEndExclusive = dateOnlyValue(context, itemIndex, row.dateEndExclusive, selector.field);
              const timezone = String(row.timezone ?? '').trim();
              if (dateStart !== null) setQueryParameter(selector.dateStartParameter, dateStart);
              if (dateEndExclusive !== null) setQueryParameter(selector.dateEndExclusiveParameter, dateEndExclusive);
              if (timezone) setQueryParameter(selector.timezoneParameter, timezone);
            }

            const semanticQueryInput = useCapabilityQuery ? rawCapabilityQueryInput : {};
          """
          node = replace_section(
              node,
              "  const localDateWindows = context.getNodeParameter('localDateWindows.window', itemIndex, []) as QueryLocalDateWindow[];\n",
              "  for (const [parameter, value] of Object.entries(semanticQueryInput)) {\n",
              local_block,
              'local date / capability execution block',
          )
          node = node.replace('Semantic Query parameter ${parameter} must be a scalar value', 'Capability Query parameter ${parameter} must be a scalar value')

          query_mode_ui = """      {
                displayName: 'Query Mode', name: 'queryMode', type: 'options', noDataExpression: true,
                typeOptions: { loadOptionsMethod: 'getQueryModes', loadOptionsDependsOn: ['spaceId', 'recordType'] },
                options: [], default: 'standard',
                displayOptions: { show: { resource: ['modelRecord'], operation: ['list'] } },
                description: 'Standard Query is always available. Capability Query is offered only when the selected Record Type publishes a grouped capability query through Runtime Discovery.',
              },
              {
                displayName: 'Search', name: 'search', type: 'string', default: '',
                displayOptions: { show: { resource: ['modelRecord'], operation: ['list'], queryMode: ['standard'] } },
                description: 'Full-text search across fields declared searchable by LifeSpace. Leave empty to disable search.',
              },
          """
          node = replace_section(
              node,
              "      {\n        displayName: 'Search', name: 'search', type: 'string', default: '',\n",
              "      {\n        displayName: 'Filters', name: 'filters', type: 'fixedCollection', default: {},\n",
              query_mode_ui,
              'query mode UI',
          )

          filters_start = node.find("      {\n        displayName: 'Filters', name: 'filters', type: 'fixedCollection', default: {},\n")
          filters_end = node.find("      {\n        displayName: 'Local Date Windows', name: 'localDateWindows', type: 'fixedCollection', default: {},\n", filters_start)
          if filters_start < 0 or filters_end < 0:
              raise SystemExit('filters UI section not found')
          filters = node[filters_start:filters_end]
          filters = replace_once(
              filters,
              "displayOptions: { show: { resource: ['modelRecord'], operation: ['list'] } },",
              "displayOptions: { show: { resource: ['modelRecord'], operation: ['list'], queryMode: ['standard'] } },",
              'filters query-mode visibility',
          )
          local_filter = """          { displayName: 'Local Date Window', name: 'localDateWindow', values: [
                { displayName: 'Field Name or ID', name: 'field', type: 'options', typeOptions: { loadOptionsMethod: 'getLocalDateWindowFields', loadOptionsDependsOn: ['spaceId', 'recordType'] }, options: [], default: '', required: true, description: 'Choose a datetime field whose published Time Semantics includes a local-date-window transport.' },
                { displayName: 'Start Date', name: 'dateStart', type: 'dateTime', default: '', required: true, description: 'Inclusive local calendar start date. The adapter sends YYYY-MM-DD and does not calculate UTC boundaries.' },
                { displayName: 'End Date (Exclusive)', name: 'dateEndExclusive', type: 'dateTime', default: '', required: true, description: 'Exclusive local calendar end date.' },
                { displayName: 'Viewing Timezone', name: 'timezone', type: 'string', default: '', required: true, placeholder: 'Europe/Amsterdam', description: 'IANA timezone passed unchanged to LifeSpace Core.' },
              ] },
          """
          filters = replace_once(filters, "          { displayName: 'Person Filter', name: 'person', values: [\n", local_filter + "          { displayName: 'Person Filter', name: 'person', values: [\n", 'local date window filter UI')
          node = node[:filters_start] + filters + node[filters_end:]

          node = replace_section(
              node,
              "      {\n        displayName: 'Local Date Windows', name: 'localDateWindows', type: 'fixedCollection', default: {},\n",
              "      {\n        displayName: 'Semantic Query Name or ID', name: 'semanticQueryKey', type: 'options',\n",
              '',
              'remove top-level local date windows',
          )

          capability_ui = """      {
                displayName: 'Capability Query Name or ID', name: 'semanticQueryKey', type: 'options', noDataExpression: true,
                typeOptions: { loadOptionsMethod: 'getCapabilityQueries', loadOptionsDependsOn: ['spaceId', 'recordType'] },
                options: [], default: '', required: true,
                displayOptions: { show: { resource: ['modelRecord'], operation: ['list'], queryMode: ['capability'] } },
                description: 'Choose a grouped capability query published by the selected LifeSpace Record Type.',
              },
              {
                displayName: 'Capability Query Parameters', name: 'semanticQueryInput', type: 'resourceMapper',
                default: { mappingMode: 'defineBelow', value: null }, noDataExpression: true,
                typeOptions: {
                  loadOptionsDependsOn: ['spaceId', 'recordType', 'semanticQueryKey'],
                  resourceMapper: {
                    resourceMapperMethod: 'getSemanticQueryInputFields', mode: 'add',
                    fieldWords: { singular: 'query parameter', plural: 'query parameters' },
                    addAllFields: true, supportAutoMap: false,
                    noFieldsError: 'Choose a Capability Query to load its LifeSpace-published parameters.',
                  },
                },
                displayOptions: { show: { resource: ['modelRecord'], operation: ['list'], queryMode: ['capability'] } },
                description: 'Parameters are projected directly from query.capabilityQueries. Local dates/timezone are sent to Core unchanged; Core owns overlap and DST semantics.',
              },
              {
                displayName: 'Capability Sort Name or ID', name: 'semanticSort', type: 'options',
                typeOptions: { loadOptionsMethod: 'getSemanticSorts', loadOptionsDependsOn: ['spaceId', 'recordType', 'semanticQueryKey'] },
                options: [], default: '',
                displayOptions: { show: { resource: ['modelRecord'], operation: ['list'], queryMode: ['capability'] } },
                description: 'Optional capability-specific ordering published with the selected Capability Query.',
              },
          """
          node = replace_section(
              node,
              "      {\n        displayName: 'Semantic Query Name or ID', name: 'semanticQueryKey', type: 'options',\n",
              "      {\n        displayName: 'Return All', name: 'returnAll', type: 'boolean', default: false,\n",
              capability_ui,
              'capability query UI',
          )

          sorts_start = node.find("      {\n        displayName: 'Sorts', name: 'sorts', type: 'fixedCollection', default: {},\n")
          sorts_end = node.find("      {\n        displayName: 'Options', name: 'options', type: 'collection'", sorts_start)
          if sorts_start < 0 or sorts_end < 0:
              raise SystemExit('sorts UI section not found')
          sorts = node[sorts_start:sorts_end]
          sorts = replace_once(
              sorts,
              "displayOptions: { show: { resource: ['modelRecord'], operation: ['list'] } },",
              "displayOptions: { show: { resource: ['modelRecord'], operation: ['list'], queryMode: ['standard'] } },",
              'sorts query-mode visibility',
          )
          node = node[:sorts_start] + sorts + node[sorts_end:]

          query_modes_method = """      async getQueryModes(this: ILoadOptionsFunctions): Promise<INodePropertyOptions[]> {
                const modes: INodePropertyOptions[] = [{
                  name: 'Standard Query',
                  value: 'standard',
                  description: 'Search, filters, comparisons, local-date windows, and generic sorting',
                }];
                try {
                  const selected = await optionModel(this);
                  if ((selected?.model.query.capabilityQueries ?? []).length > 0) {
                    modes.push({
                      name: 'Capability Query',
                      value: 'capability',
                      description: 'Use one grouped query contract published by a LifeSpace Capability',
                    });
                  }
                } catch {
                  // Keep Standard Query available even when optional capability metadata cannot be loaded.
                }
                return modes;
              },
          """
          node = replace_once(
              node,
              "      async getCapabilityQueries(this: ILoadOptionsFunctions): Promise<INodePropertyOptions[]> {\n",
              query_modes_method + "      async getCapabilityQueries(this: ILoadOptionsFunctions): Promise<INodePropertyOptions[]> {\n",
              'query mode loadOptions',
          )
          node_path.write_text(node)

          package_path = Path('package.json')
          package = json.loads(package_path.read_text())
          package['n8n']['nodes'] = [entry for entry in package['n8n']['nodes'] if 'LifeSpaceTool' not in entry]
          package_path.write_text(json.dumps(package, indent=2) + '\n')

          source_path = Path('test/source-contract.test.mjs')
          source = source_path.read_text()
          source = replace_once(
              source,
              "  assert.equal((node.match(/noDataExpression: true/gu) ?? []).length, 6);\n",
              "  assert.match(node, /name: 'queryMode'[\\s\\S]{0,160}noDataExpression: true/u);\n",
              'source contract queryMode assertion',
          )
          source_path.write_text(source)

          # Exercise the new nested filter path instead of only the removed 0.1.7 top-level UI.
          time_path = Path('test/time-query-semantics.test.mjs')
          time = time_path.read_text()
          old_window = """    'localDateWindows.window': [{
                field: createdAt.value,
                dateStart: '2026-09-10T00:00:00.000+02:00',
                dateEndExclusive: '2026-09-11T00:00:00.000+02:00',
                timezone: 'Europe/Amsterdam',
              }],
          """
          if old_window in time:
              time = time.replace(old_window, """    filters: { localDateWindow: [{
                field: createdAt.value,
                dateStart: '2026-09-10T00:00:00.000+02:00',
                dateEndExclusive: '2026-09-11T00:00:00.000+02:00',
                timezone: 'Europe/Amsterdam',
              }] },
          """, 1)
          else:
              # Whitespace-insensitive fallback for the same fixture.
              import re
              pattern = r"    'localDateWindows\.window': \[\{\n\s+field: createdAt\.value,\n\s+dateStart: '2026-09-10T00:00:00\.000\+02:00',\n\s+dateEndExclusive: '2026-09-11T00:00:00\.000\+02:00',\n\s+timezone: 'Europe/Amsterdam',\n\s+\}\],\n"
              repl = "    filters: { localDateWindow: [{\n      field: createdAt.value,\n      dateStart: '2026-09-10T00:00:00.000+02:00',\n      dateEndExclusive: '2026-09-11T00:00:00.000+02:00',\n      timezone: 'Europe/Amsterdam',\n    }] },\n"
              time, count = re.subn(pattern, repl, time, count=1)
              if count != 1:
                  raise SystemExit('time semantics local-date-window fixture not found')
          time_path.write_text(time)

          regression = dedent(r"""
          import assert from 'node:assert/strict';
          import { createRequire } from 'node:module';
          import { readFile } from 'node:fs/promises';
          import test from 'node:test';

          const require = createRequire(import.meta.url);
          const { LifeSpace } = require('../dist/nodes/LifeSpace/LifeSpace.node.js');

          function property(node, name) {
            const value = node.description.properties.find((entry) => entry.name === name);
            assert.ok(value, `missing parameter ${name}`);
            return value;
          }

          function semanticDetail(modelKey, capabilityQueries = []) {
            return {
              data: {
                key: modelKey,
                version: 1,
                schemaHash: `sha256:${modelKey}`,
                display: { singular: modelKey, plural: `${modelKey}s` },
                description: null,
                declaredAccess: ['read', 'write'],
                fields: [], defaults: {},
                query: {
                  searchable: [], filterable: [], sortable: [], search: null, filters: [],
                  comparisons: [], capabilityQueries,
                  sort: {
                    parameter: 'sort', syntax: 'field:direction', repeatable: true, ordered: true,
                    maxCriteria: 8, genericDefault: ['createdAt:desc'],
                    envelopeFields: ['createdAt', 'updatedAt'], nullPlacement: 'last',
                    genericValues: ['createdAt:asc', 'createdAt:desc', 'updatedAt:asc', 'updatedAt:desc'],
                  },
                  pagination: {
                    limit: { parameter: 'limit', minimum: 1, maximum: 200, default: 100 },
                    cursor: { parameter: 'cursor', type: 'string' },
                  },
                },
                actions: [], capabilities: capabilityQueries.length ? ['calendar'] : [], capabilityBindings: {},
              },
            };
          }

          function optionContext(modelKey, capabilityQueries = []) {
            const inventory = {
              data: {
                semanticDetailPathTemplate: '/api/v1/spaces/{spaceId}/_discovery/models/{modelKey}',
                models: [{
                  key: modelKey, version: 1, schemaHash: `sha256:${modelKey}`,
                  display: { singular: modelKey, plural: `${modelKey}s` },
                  capabilities: capabilityQueries.length ? ['calendar'] : [], actions: [],
                }],
                spaces: [{ spaceId: 'spc_test', spaceName: 'Test Space', models: [{ modelKey, access: ['read', 'write'] }] }],
              },
            };
            const parameters = { spaceId: 'spc_test', recordType: modelKey, operation: 'list' };
            return {
              getCredentials: async () => ({ baseUrl: 'https://example.invalid/api/v1' }),
              getNode: () => ({ name: 'LifeSpace' }),
              getNodeParameter(name, fallback) { return Object.hasOwn(parameters, name) ? parameters[name] : fallback; },
              getCurrentNodeParameter(name) { return Object.hasOwn(parameters, name) ? parameters[name] : undefined; },
              helpers: {
                async httpRequestWithAuthentication(_credentialName, options) {
                  if (options.url.endsWith('/me/_discovery/inventory')) return inventory;
                  if (options.url.endsWith(`/spaces/spc_test/_discovery/models/${modelKey}`)) return semanticDetail(modelKey, capabilityQueries);
                  throw new Error(`Unexpected request ${options.method} ${options.url}`);
                },
              },
            };
          }

          test('normal LifeSpace node is the single Agent Tool surface and runtime selectors remain AI-fillable', async () => {
            const node = new LifeSpace();
            assert.equal(node.description.usableAsTool, true);
            assert.equal(property(node, 'resource').noDataExpression, true);
            assert.equal(property(node, 'operation').noDataExpression, true);
            assert.equal(property(node, 'spaceId').noDataExpression, undefined);
            assert.equal(property(node, 'recordType').noDataExpression, undefined);
            assert.equal(property(node, 'recordId').noDataExpression, undefined);

            const packageJson = JSON.parse(await readFile(new URL('../package.json', import.meta.url), 'utf8'));
            assert.deepEqual(packageJson.n8n.nodes, [
              'dist/nodes/LifeSpace/LifeSpace.node.js',
              'dist/nodes/LifeSpaceTrigger/LifeSpaceTrigger.node.js',
            ]);
          });

          test('List Query no longer exposes dead top-level Time or Capability controls', () => {
            const node = new LifeSpace();
            const names = node.description.properties.map((entry) => entry.name);
            assert.equal(names.includes('localDateWindows'), false);

            const queryMode = property(node, 'queryMode');
            assert.equal(queryMode.noDataExpression, true);
            assert.equal(queryMode.default, 'standard');

            const filters = property(node, 'filters');
            assert.ok(filters.options.some((entry) => entry.name === 'localDateWindow'));
            assert.deepEqual(filters.displayOptions.show.queryMode, ['standard']);
            assert.deepEqual(property(node, 'search').displayOptions.show.queryMode, ['standard']);
            assert.deepEqual(property(node, 'sorts').displayOptions.show.queryMode, ['standard']);

            const capability = property(node, 'semanticQueryKey');
            assert.equal(capability.displayName, 'Capability Query Name or ID');
            assert.equal(capability.required, true);
            assert.equal(capability.noDataExpression, true);
            assert.deepEqual(capability.displayOptions.show.queryMode, ['capability']);
            assert.deepEqual(property(node, 'semanticQueryInput').displayOptions.show.queryMode, ['capability']);
            assert.deepEqual(property(node, 'semanticSort').displayOptions.show.queryMode, ['capability']);
          });

          test('Capability Query mode is advertised only by published Discovery metadata', async () => {
            const node = new LifeSpace();
            const ordinary = await node.methods.loadOptions.getQueryModes.call(optionContext('task'));
            assert.deepEqual(ordinary.map((entry) => entry.value), ['standard']);

            const calendarWindow = {
              key: 'calendar.window', capability: 'calendar', semantics: 'record-interval-overlap', recurrenceExpansion: false,
              parameters: [
                { parameter: 'windowStartDate', type: 'date', required: true, role: 'window-start-date' },
                { parameter: 'windowEndDateExclusive', type: 'date', required: true, role: 'window-end-date-exclusive' },
                { parameter: 'viewingTimezone', type: 'timezone', required: true, role: 'viewing-timezone' },
              ],
              ordering: { parameter: 'sort', values: ['calendarStart:asc'], default: 'calendarStart:asc' },
            };
            const calendar = await node.methods.loadOptions.getQueryModes.call(optionContext('event', [calendarWindow]));
            assert.deepEqual(calendar.map((entry) => entry.value), ['standard', 'capability']);
          });
          """).lstrip()
          Path('test/query-ui-regression.test.mjs').write_text(regression)

          readme_path = Path('README.md')
          readme = readme_path.read_text()
          list_docs = """**Query Mode** separates ordinary Generic Query UX from capability-owned query semantics:

          - **Standard Query** is always available and exposes optional **Search**, typed **Filters**, explicit **Number Comparison** / **Date / Time Comparison**, optional **Local Date Window** filter rows, and generic **Sorts**;
          - **Capability Query** is offered only when the selected Record Type publishes `query.capabilityQueries`; its selector, parameters, and ordering are loaded from Runtime Discovery;
          - **Return All** follows `nextCursor` automatically, while **Limit** bounds a single-page query.

          Local-date windows are optional filter rows rather than an always-visible top-level control. The adapter sends published date-window parameter names and the IANA timezone unchanged; Core owns timezone/DST conversion. Existing `exact/from/to` filters preserve the legacy inclusive `To` behavior.

          Generic Search/Filters/Sorts are intentionally hidden in Capability Query mode until LifeSpace publishes machine-readable facet-composability metadata. This prevents the adapter from guessing which generic parameters may be mixed with a grouped capability query.

          Use **Sorts → Add Sort** in Standard Query to add zero or more sort criteria in priority order. Sortable model fields use authoritative `title` metadata from Runtime Discovery, while envelope fields such as `createdAt` / `updatedAt` are offered only when Discovery advertises them. Multiple criteria are sent as ordered repeated `sort=field:direction` query parameters.

          """
          readme = replace_section(
              readme,
              'The normal UI supports:\n',
              'Advanced **Options** contain manual **Cursor** as an escape hatch.\n',
              list_docs,
              'README List / Query documentation',
          )
          readme_path.write_text(readme)
          PY

          npm version 0.1.8 --no-git-tag-version --allow-same-version
          rm .github/workflows/temporary-42-refactor-v2.yml
          npm install --global npm@11.15.0
          npm ci
          npm run lint:fix
          npm run lint
          npm test
          git diff --check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: restore usable LifeSpace query and Agent Tool UX"
          git push origin "HEAD:${GITHUB_REF_NAME}"
