name: Temporary 0.2.6 version bump

on:
  push:
    branches:
      - release/0.2.6

permissions:
  contents: write

jobs:
  bump:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v5
        with:
          ref: release/0.2.6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24.20.0'

      - name: Generate consistent package metadata
        shell: bash
        run: |
          set -euo pipefail
          npm version 0.2.6 --no-git-tag-version
          test "$(node -p "require('./package.json').version")" = "0.2.6"
          test "$(node -p "require('./package-lock.json').version")" = "0.2.6"
          test "$(node -p "require('./package-lock.json').packages[''].version")" = "0.2.6"

      - name: Commit generated version files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m 'chore(release): bump version to 0.2.6'
          git push origin HEAD:release/0.2.6
