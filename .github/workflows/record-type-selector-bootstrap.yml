name: Record Type Selector Bootstrap

on:
  push:
    branches:
      - fix/model-key-workflow-composability
    paths:
      - .github/workflows/record-type-selector-bootstrap.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/model-key-workflow-composability
      - uses: actions/setup-node@v5
        with:
          node-version: '22.22.0'
          package-manager-cache: false
      - run: npm install --global npm@11.15.0
      - run: node scripts/fix-record-type-bootstrap.mjs
      - run: node scripts/apply-record-type-selector.mjs
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Commit implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: make record types workflow-composable"
          git push origin HEAD:fix/model-key-workflow-composability
