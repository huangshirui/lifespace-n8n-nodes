name: Publish

on:
  push:
    tags:
      - '*.*.*'

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22.22.0'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Upgrade npm for Trusted Publishing
        run: npm install --global npm@^11.15.0

      - name: Verify Trusted Publishing context
        shell: bash
        run: |
          set -euo pipefail
          node_version="$(node --version)"
          npm_version="$(npm --version)"
          echo "Node.js ${node_version}"
          echo "npm ${npm_version}"
          node -e "const [major, minor] = process.versions.node.split('.').map(Number); if (major < 22 || (major === 22 && minor < 14)) throw new Error('Trusted Publishing requires Node.js >= 22.14.0')"
          NPM_VERSION="$npm_version" node -e "const [major, minor] = process.env.NPM_VERSION.split('.').map(Number); if (major < 11 || (major === 11 && minor < 5)) throw new Error('Trusted Publishing requires npm >= 11.5.1')"
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" || { echo 'Missing GitHub Actions OIDC request URL; ensure id-token: write is enabled.' >&2; exit 1; }
          test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" || { echo 'Missing GitHub Actions OIDC request token; ensure id-token: write is enabled.' >&2; exit 1; }

      - name: Install dependencies
        run: npm ci

      - name: Release with provenance
        run: npm run release
