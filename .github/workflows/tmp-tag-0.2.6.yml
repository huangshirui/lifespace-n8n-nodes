name: Temporary verified 0.2.6 tag

on:
  push:
    branches:
      - release/tag-0.2.6

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout helper branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Tag exact verified main commit
        shell: bash
        env:
          EXPECTED_SHA: ba95c03dd801d3f99d9cbce405876a2157fb4625
        run: |
          set -euo pipefail
          main_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$main_sha" = "$EXPECTED_SHA" || { echo "main moved: $main_sha" >&2; exit 1; }
          test "$(git show "$EXPECTED_SHA:package.json" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).version))")" = "0.2.6"
          test -z "$(git ls-remote --tags origin refs/tags/0.2.6)" || { echo 'tag 0.2.6 already exists' >&2; exit 1; }
          git tag 0.2.6 "$EXPECTED_SHA"
          test "$(git rev-parse 0.2.6)" = "$EXPECTED_SHA"
          git push origin refs/tags/0.2.6
