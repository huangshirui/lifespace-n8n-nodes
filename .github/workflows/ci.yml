name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22.22.0'

      - name: Install dependencies
        run: npm install

      - name: Test
        run: npm test

      - name: Lint
        id: lint
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npm run lint 2>&1 | tee lint-output.txt
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Report lint failure
        if: steps.lint.outcome == 'failure' && github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('lint-output.txt', 'utf8').slice(-50000);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `<!-- lifespace-ci-lint-debug -->\n### CI lint failure\n\n\`\`\`text\n${output}\n\`\`\``,
            });

      - name: Fail after lint report
        if: steps.lint.outcome == 'failure'
        run: exit 1

      - name: Build
        run: npm run build
