name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24.20.0'

      - name: Install pinned npm
        run: npm install --global npm@11.15.0

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test
        env:
          LIFESPACE_AGENT_TOOL_CONTRACT_DIR: .artifacts/agent-tool-contracts

      - name: Upload generated Agent Tool contracts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-tool-contracts
          path: .artifacts/agent-tool-contracts/*.json
          if-no-files-found: error
          retention-days: 30
