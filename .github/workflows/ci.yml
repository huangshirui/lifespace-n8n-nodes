name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24.20.0'

      - name: Install pinned npm
        run: npm install --global npm@11.15.0

      - name: Verify package metadata
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./package.json').version")"
          lock_version="$(node -p "require('./package-lock.json').version")"
          lock_root_version="$(node -p "require('./package-lock.json').packages[''].version")"
          test "$package_version" = "$lock_version" || { echo "package.json ($package_version) does not match package-lock.json ($lock_version)." >&2; exit 1; }
          test "$package_version" = "$lock_root_version" || { echo "package.json ($package_version) does not match package-lock root package ($lock_root_version)." >&2; exit 1; }

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test
        env:
          LIFESPACE_AGENT_TOOL_CONTRACT_DIR: .artifacts/agent-tool-contracts/raw

      - name: Build provider-facing Agent Tool contracts
        run: |
          npm run agent-contract:build -- .artifacts/agent-tool-contracts/raw .artifacts/agent-tool-contracts/openai

      - name: Guard generated Agent Tool contracts
        run: |
          for file in .artifacts/agent-tool-contracts/openai/*.json; do
            npm run agent-contract:guard -- "$file"
          done

      - name: Summarize generated Agent Tool contracts
        shell: bash
        run: |
          set -o pipefail
          npm run agent-contract:summary -- .artifacts/agent-tool-contracts/openai | tee .artifacts/agent-tool-contracts/summary.md
          cat .artifacts/agent-tool-contracts/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload generated Agent Tool contracts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-tool-contracts
          path: .artifacts/agent-tool-contracts
          if-no-files-found: error
          retention-days: 30
