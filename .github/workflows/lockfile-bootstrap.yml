name: Bootstrap package lock

on:
  push:
    branches:
      - chore/package-lock-reproducibility
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/lockfile-bootstrap.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: chore/package-lock-reproducibility

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22.22.0'

      - name: Install pinned npm
        run: npm install --global npm@11.15.0

      - name: Generate package lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit generated package lock
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json is already up to date"
            exit 0
          fi
          git commit -m "chore: generate package lock with npm 11.15.0"
          git push origin HEAD:chore/package-lock-reproducibility
